[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pusht_bc"
version = "0.1.0"
description = "Behavior cloning on Push-T (step 5)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "lerobot[pusht,diffusion]==0.7.0",
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "imageio[ffmpeg]",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
